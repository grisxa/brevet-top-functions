# This is a basic workflow to help you get started with Actions

name: Brevet result JSON export

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths: [ "json_export/**" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - id: auth
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: 'projects/289323711544/locations/global/workloadIdentityPools/baltic-star-pool/providers/github-actions-provider'
          service_account: 'github-deploy-functions@baltic-star-cloud.iam.gserviceaccount.com'
          token_format: 'access_token'

      - id: deploy
        name: Deploy brevet result JSON export function to the cloud
        uses: google-github-actions/deploy-cloud-functions@v4
        with:
          name: 'jsonExport'
          environment: GEN_2
          runtime: 'python314'
          source_dir: json_export
          entry_point: json_export
          service_timeout: 180
          memory: 512M
          build_environment_variables: |-
            UV_DEFAULT_INDEX=https://pypi.org/simple/
            UV_INDEX=https://oauth2accesstoken:${{ steps.auth.outputs.access_token }}@us-central1-python.pkg.dev/baltic-star-cloud/brevet-top-python-repo/simple/
            UV_INDEX_STRATEGY=unsafe-best-match